# 宿主机 Nginx 示例：同一个域名下同时提供 Aurora 前端与哪吒面板
# 假设：哪吒面板监听 127.0.0.1:8008，Aurora 静态文件位于 /opt/nezha/aurora
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name status.example.com;

    # ssl_certificate     /etc/nginx/ssl/status.example.com.crt;
    # ssl_certificate_key /etc/nginx/ssl/status.example.com.key;

    # 1) Agent 上报通道（gRPC / h2c），与官方模板保持一致，务必保留
    location /proto.NezhaService/ {
        grpc_pass grpc://127.0.0.1:8008;
        grpc_set_header Host $host;
        grpc_set_header nz-realip $remote_addr;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
        client_max_body_size 10m;
    }

    # 2) 面板后台 + REST API + 实时 WebSocket
    location ~ ^/(dashboard|api/v1) {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 哪吒会校验 Origin，避免 WebSocket 升级被拒绝
        proxy_set_header Origin https://$host;
        proxy_set_header nz-realip $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 3) Aurora 前端
    location / {
        root /opt/nezha/aurora;
        try_files $uri $uri/ /index.html;
    }
}
