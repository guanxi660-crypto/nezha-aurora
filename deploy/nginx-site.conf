# 宿主机 Nginx 示例：同一个域名下同时提供 Aurora 前端与哪吒面板
# 假设：哪吒面板监听 127.0.0.1:8008，Aurora 静态文件位于 /opt/nezha/aurora
# 默认只启用 HTTP。需要 HTTPS 时：取消下面 listen 443 ssl / http2 on 的注释，
# 并填写 ssl_certificate 与 ssl_certificate_key，否则 nginx -t 会因缺证书失败。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    # listen 443 ssl;   # 启用 HTTPS 时取消注释并配置下方证书
    # http2 on;          # 启用 HTTPS 时取消注释
    server_name status.example.com;

    # ssl_certificate     /etc/nginx/ssl/status.example.com.crt;
    # ssl_certificate_key /etc/nginx/ssl/status.example.com.key;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml application/x-javascript;

    # 1) Agent 上报通道（gRPC / h2c），与官方模板保持一致，务必保留
    location /proto.NezhaService/ {
        grpc_pass grpc://127.0.0.1:8008;
        grpc_set_header Host $host;
        grpc_set_header nz-realip $remote_addr;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
        client_max_body_size 10m;
    }

    # 2) 面板后台 + REST API + 实时 WebSocket
    location ~ ^/(dashboard|api/v1) {
        # WS URL query 中带管理员 JWT，禁止写入 access.log
        access_log off;
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # 哪吒会校验 Origin，避免 WebSocket 升级被拒绝
        proxy_set_header Origin https://$host;
        proxy_set_header nz-realip $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 3) Aurora 前端
    # 带 hash 的构建产物长期缓存
    location /assets/ {
        root /opt/nezha/aurora;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML 入口不缓存，避免重新构建后仍看到旧页面
    location = /index.html {
        root /opt/nezha/aurora;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        root /opt/nezha/aurora;
        try_files $uri $uri/ /index.html;
    }
}
