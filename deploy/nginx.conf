# 容器内使用的 Nginx 配置：只负责托管静态前端 + SPA 回退。
# /api/v1 与 /dashboard 由外层反向代理转发给哪吒面板（见 nginx-site.conf 示例）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的静态资源可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退，保证 /server/1 之类的前端路由可用
    location / {
        try_files $uri $uri/ /index.html;
    }
}
